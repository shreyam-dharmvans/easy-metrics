# ==============================================================================
# EasyMetrics Production & Self-Hosting Orchestration
# Run with:  docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:
  # 1. Primary PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: easymetrics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-easymetrics_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-easymetrics_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Core Ingestion & Analytics Query API (Express + Prisma)
  api:
    image: ghcr.io/shreyam-dharmvans/easy-metrics-api:latest
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: easymetrics-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-easymetrics_db}?schema=public
      API_PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-easymetrics-prod-jwt-secret-replace-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

  # 3. AI Root-Cause Diagnostic Agent & FastMCP Server (FastAPI + LangGraph)
  ai-agent:
    image: ghcr.io/shreyam-dharmvans/easy-metrics-ai-agent:latest
    build:
      context: .
      dockerfile: services/ai-agent/Dockerfile
    container_name: easymetrics-ai-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-easymetrics_db}
      AGENT_PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-easymetrics-prod-jwt-secret-replace-in-production}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Developer Dashboard UI (Next.js 14 App Router)
  web:
    image: ghcr.io/shreyam-dharmvans/easy-metrics-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_AGENT_URL: ${NEXT_PUBLIC_AGENT_URL:-}
    container_name: easymetrics-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_AGENT_URL: ${NEXT_PUBLIC_AGENT_URL:-}
    depends_on:
      - api
      - ai-agent

  # 5. Automated Zero-Downtime Image Auto-Updater (GitOps Pull)
  watchtower:
    image: containrrr/watchtower
    container_name: easymetrics-watchtower
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 120 --cleanup --api-version 1.44

volumes:
  postgres_data:
    driver: local
