name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel outdated builds on new commits to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. NODE.JS MONOREPO: TYPECHECK, NEXT.JS BUILD & INTEGRATION TESTS
  # ============================================================================
  node-ci:
    name: Node.js Monorepo (SDK, API, Web)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easymetrics_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easymetrics_db?schema=public
      JWT_SECRET: easymetrics-ci-test-secret-at-least-32-chars-long
      NODE_ENV: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Database Schema
        run: |
          npm run prisma:generate --workspace=apps/api
          npm run prisma:push --workspace=apps/api

      - name: Monorepo Typecheck & Production Build
        run: npm run build

      - name: Run Node.js & API Integration Test Suites
        run: npm test

  # ============================================================================
  # 2. PYTHON SERVICE: FASTAPI & LANGGRAPH STATE TESTS
  # ============================================================================
  python-ci:
    name: AI Agent (FastAPI & LangGraph)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easymetrics_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easymetrics_db
      JWT_SECRET: easymetrics-ci-test-secret-at-least-32-chars-long
      GROQ_API_KEY: mock_ci_groq_api_key_not_invoked_live
      GROQ_MODEL: llama-3.3-70b-versatile

    defaults:
      run:
        working-directory: services/ai-agent

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/ai-agent/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: pytest tests/
